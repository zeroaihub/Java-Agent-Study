<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大模型流式输出 - 打字机效果</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f5f6f8;
      color: #1f2329;
    }
    h1 { font-size: 20px; }
    .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
    #question {
      flex: 1;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #d0d3d9;
      border-radius: 8px;
      outline: none;
    }
    #question:focus { border-color: #4c6ef5; }
    button {
      padding: 10px 20px;
      font-size: 14px;
      color: #fff;
      background: #4c6ef5;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { background: #a5b4f0; cursor: not-allowed; }
    #status {
      font-size: 12px;
      color: #8a8f99;
      margin-bottom: 8px;
      min-height: 18px;
    }
    #output {
      background: #fff;
      border: 1px solid #e4e6eb;
      border-radius: 10px;
      padding: 16px 18px;
      min-height: 200px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.7;
      font-size: 15px;
    }
    .cursor {
      display: inline-block;
      width: 8px;
      background: #4c6ef5;
      margin-left: 1px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <h1>大模型流式输出（打字机效果）</h1>
  <div class="input-row">
    <input id="question" type="text" placeholder="输入问题，例如：讲个笑话" value="讲个笑话">
    <button id="sendBtn" onclick="startStream()">发送</button>
  </div>
  <div id="status"></div>
  <div id="output"></div>

  <script>
    let source = null;

    function startStream() {
      const question = document.getElementById('question').value.trim();
      if (!question) { return; }

      const output = document.getElementById('output');
      const status = document.getElementById('status');
      const btn = document.getElementById('sendBtn');

      // 关闭上一次连接
      if (source) { source.close(); }

      output.textContent = '';
      status.textContent = '连接中...';
      btn.disabled = true;

      // 光标元素，营造打字机感
      const cursor= document.createElement('span');
      cursor.className = 'cursor';
      cursor.innerHTML = '&nbsp;';
      output.appendChild(cursor);

      // EventSource 只支持 GET，问题用 encodeURIComponent 编码避免中文 400
      const url = '/demo5/stream?question=' + encodeURIComponent(question);
      source = new EventSource(url);

      source.onopen = () => { status.textContent = '正在生成...'; };

      // 默认 message 事件：每来一个增量 delta 就追加一个字
      source.onmessage = (e) => {
        cursor.insertAdjacentText('beforebegin', e.data);
      };

      // 后端结束时发送 name=done 的事件
      source.addEventListener('done', () => {
        status.textContent = '完成';
        cursor.remove();
        source.close();
        btn.disabled = false;
      });

      source.onerror = () => {
        // 流正常结束也会触发 onerror，需判断是否已完成
        if (source.readyState === EventSource.CLOSED) {
          status.textContent = status.textContent === '完成' ? '完成' : '连接已关闭';
        } else {
          status.textContent = '连接出错';
        }
        cursor.remove();
        source.close();
        btn.disabled = false;
      };
    }

    // 回车发送
    document.getElementById('question').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { startStream(); }
    });
  </script>
</body>
</html>
